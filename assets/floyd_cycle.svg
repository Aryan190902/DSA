<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="640" height="460" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-size="13" fill="#1e293b">
<circle cx="32" cy="30" r="9" fill="#f97316"/><text x="32" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">F</text><text x="50" y="35">fast: 2 steps / tick</text>
<circle cx="32" cy="56" r="9" fill="none" stroke="#2563eb" stroke-width="3"/><text x="50" y="61">slow: 1 step / tick</text>
<circle cx="32" cy="82" r="9" fill="#16a34a"/><text x="32" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">P</text><text x="50" y="87">P: restarts from head</text>
</g>
<line x1="102.0" y1="200.0" x2="174.0" y2="200.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="222.0" y1="200.0" x2="294.0" y2="200.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="335.6" y1="184.4" x2="421.6" y2="98.4" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="455.6" y1="95.6" x2="541.6" y2="181.6" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="544.4" y1="215.6" x2="458.4" y2="301.6" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="424.4" y1="304.4" x2="338.4" y2="218.4" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="560" cy="200" r="36" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4444;0.6111" dur="18.0s" repeatCount="indefinite"/></circle>
<text x="560" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#f97316" opacity="0">slow == fast<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4444;0.6111" dur="18.0s" repeatCount="indefinite"/></text>
<circle cx="320" cy="200" r="38" fill="none" stroke="#16a34a" stroke-width="4" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7778" dur="18.0s" repeatCount="indefinite"/></circle>
<circle cx="80" cy="200" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="80" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">3</text>
<circle cx="200" cy="200" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="200" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">2</text>
<circle cx="320" cy="200" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="320" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">0</text>
<circle cx="440" cy="80" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="440" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">-4</text>
<circle cx="560" cy="200" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="560" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">5</text>
<circle cx="440" cy="320" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/><text x="440" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">7</text>
<text x="80" y="244" text-anchor="middle" font-size="12" fill="#64748b">head</text>
<text x="320" y="244" text-anchor="middle" font-size="12" fill="#64748b">cycle start</text>
<g font-size="13" font-weight="600">
<line x1="80" y1="236" x2="80" y2="246" stroke="#7c3aed"/><line x1="80" y1="246" x2="320" y2="246" stroke="#7c3aed" stroke-width="2"/><line x1="320" y1="246" x2="320" y2="236" stroke="#7c3aed"/>
<text x="200" y="268" text-anchor="middle" fill="#7c3aed">a = 2</text>
<text x="548" y="112" fill="#0891b2">b = 2</text>
<text x="405" y="338" text-anchor="end" fill="#be185d">c − b = 2</text>
</g>
<g transform="translate(80,200)" >
  <circle r="31" fill="none" stroke="#2563eb" stroke-width="4"/>
  <animateTransform attributeName="transform" type="translate" calcMode="linear" values="80,200;80,200;200,200;200,200;320,200;320,200;440,80;440,80;560,200;560,200;440,320;440,320;320,200;320,200" keyTimes="0.0000;0.0556;0.1111;0.1667;0.2222;0.2778;0.3333;0.3889;0.4444;0.6111;0.6667;0.7222;0.7778;1.0000" dur="18.0s" repeatCount="indefinite"/>
  
</g>
<g transform="translate(80,154)" >
  <circle r="12" fill="#f97316"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">F</text>
  <animateTransform attributeName="transform" type="translate" calcMode="linear" values="80,154;80,154;320,154;320,154;440,34;560,154;560,154;440,274;320,154;320,154;440,34;560,154;560,154" keyTimes="0.0000;0.0556;0.1111;0.1667;0.1944;0.2222;0.2778;0.3056;0.3333;0.3889;0.4167;0.4444;1.0000" dur="18.0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.0000;0.5556" dur="18.0s" repeatCount="indefinite"/>
</g>
<g transform="translate(80,246)" >
  <circle r="12" fill="#16a34a"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">P</text>
  <animateTransform attributeName="transform" type="translate" calcMode="linear" values="80,246;80,246;200,246;200,246;320,246;320,246" keyTimes="0.0000;0.6111;0.6667;0.7222;0.7778;1.0000" dur="18.0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5556" dur="18.0s" repeatCount="indefinite"/>
</g>
<text x="320" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" opacity="0">Start: slow and fast both begin at the head<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.0000;0.0556" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" opacity="0">Phase 1: slow moves 1 step, fast moves 2 steps<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0556;0.4444" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="426" text-anchor="middle" font-size="13" font-weight="400" fill="#475569" opacity="0">Fast keeps looping inside the cycle until it catches slow.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0556;0.4444" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" opacity="0">They meet inside the cycle<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4444;0.5556" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="426" text-anchor="middle" font-size="13" font-weight="400" fill="#475569" opacity="0">slow walked a + b, fast walked 2(a + b), so a + b = k·c<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4444;0.5556" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" opacity="0">Phase 2: P restarts at the head, slow stays where it met<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5556;0.7778" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="426" text-anchor="middle" font-size="13" font-weight="400" fill="#475569" opacity="0">Now P and slow both move 1 step at a time.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5556;0.7778" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" opacity="0">Both land on the same node: the cycle start<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7778" dur="18.0s" repeatCount="indefinite"/></text>
<text x="320" y="426" text-anchor="middle" font-size="13" font-weight="400" fill="#475569" opacity="0">a = (k−1)·c + (c − b), so both walks cover the same distance.<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.7778" dur="18.0s" repeatCount="indefinite"/></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>